<body>
<div id="shell">
  <header id="topbar">
    <a href="#/" class="logo">Fenomenler</a>
    <div class="top-actions">
      <a href="#/notifications" class="icon-btn" aria-label="Bildirimler"><svg viewBox="0 0 24 24"><path d="M16.8 3.5c-2 0-3.7 1-4.8 2.6A5.7 5.7 0 0 0 7.2 3.5 5.2 5.2 0 0 0 2 8.9c0 6 9 11.6 10 11.6s10-5.6 10-11.6a5.2 5.2 0 0 0-5.2-5.4Z"/></svg><span class="dot" id="notif-dot" hidden></span></a>

    </div>
  </header>
  <main id="view"></main>
  <nav id="tabbar">
    <a href="#/" data-tab="home" aria-label="Ana sayfa"><svg viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2V21h-6v-6.5H9V21H3Z"/></svg></a>

    <a href="#/notifications" data-tab="notifications" aria-label="Bildirimler"><svg viewBox="0 0 24 24"><path d="M16.8 3.5c-2 0-3.7 1-4.8 2.6A5.7 5.7 0 0 0 7.2 3.5 5.2 5.2 0 0 0 2 8.9c0 6 9 11.6 10 11.6s10-5.6 10-11.6a5.2 5.2 0 0 0-5.2-5.4Z"/></svg></a>

<div id="toast" hidden></div>
<script src="/app.js"></script>
